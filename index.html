<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - KI-Assistent</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🤖</span>
                <h1>JARVIS</h1>
            </div>
            <div class="status-indicator">
                <span class="status-dot online"></span>
                <span>Online</span>
            </div>
        </header>

        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message system-message">
                    <span class="timestamp">[System]</span>
                    <span>JARVIS initialisiert. Bereit für Befehle.</span>
                </div>
            </div>

            <div class="input-area">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Sprich mit JARVIS... (z.B. 'Was ist die Uhrzeit?')"
                    autocomplete="off"
                    autofocus
                >
                <button id="sendButton" class="send-button">
                    <span>▶</span>
                </button>
            </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-section">
                <h3>Aktionen</h3>
                <button class="action-button" onclick="triggerAction('zeit')">
                    <span>🕐</span> Uhrzeit
                </button>
                <button class="action-button" onclick="triggerAction('datum')">
                    <span>📅</span> Datum
                </button>
                <button class="action-button" onclick="triggerAction('wetter')">
                    <span>🌤️</span> Wetter
                </button>
                <button class="action-button" onclick="triggerAction('witz')">
                    <span>😄</span> Witz
                </button>
            </div>

            <div class="sidebar-section">
                <h3>Einstellungen</h3>
                <div class="setting">
                    <label for="themeToggle">Dark Mode</label>
                    <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                </div>
            </div>

            <div class="sidebar-section info">
                <h3>Info</h3>
                <p>JARVIS v1.0</p>
                <p>Dein persönlicher Assistent</p>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
